<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Brocade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="shell">
      <header class="hero">
        <div class="badge">v1.0</div>
        <h1>The&nbsp;Brocade</h1>
        <p class="tagline">A shared, living list of rules the crew actually agrees on.</p>
      </header>

      <section class="card">
        <form id="rule-form" class="rule-form" autocomplete="off">
          <input
            id="rule-input"
            name="rule"
            type="text"
            placeholder="Add a new rule…"
            maxlength="140"
            aria-label="New rule"
          />
          <button type="submit" id="add-btn">Add rule</button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>

        <ul id="rules" class="rules" aria-label="Rules list"></ul>
        <p id="empty" class="empty" hidden>No rules yet. Be the first to lay one down.</p>
      </section>

      <footer class="footer">
        <span id="count" class="count">0 rules</span>
      </footer>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
