name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
      - the-brocode-mobile-app-ca0d
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        env:
          # GitHub project Pages are served from /<repo-name>.
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Check whether GitHub Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; the deploy job will publish."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not enabled::Built and uploaded the web artifact, but Pages is not enabled for this repo, so the deploy step is skipped. Enable it once under Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow to publish."
          fi

  deploy:
    needs: build
    # Publish only from the default branch. The github-pages environment's
    # protection rules restrict deployments to the default branch, so deploying
    # from a feature branch is blocked; it publishes once merged to main.
    if: needs.build.outputs.pages_enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
