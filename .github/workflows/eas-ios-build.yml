name: EAS iOS build

# Manually triggered build of a real iOS app on Expo's hosted macOS builders.
# Requires:
#   - Repository secret EXPO_TOKEN (an Expo access token: https://expo.dev/settings/access-tokens)
#   - An Apple Developer Program account with iOS credentials configured in EAS
#     (either set up interactively once via `eas credentials`, or provide an
#     App Store Connect API key). See README "Installable iOS app".

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        default: preview
        options:
          - preview
          - production
      submit:
        description: Submit to App Store Connect / TestFlight after build (production only)
        type: boolean
        default: false

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait

      - name: Submit to TestFlight
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: eas submit --platform ios --latest --non-interactive
